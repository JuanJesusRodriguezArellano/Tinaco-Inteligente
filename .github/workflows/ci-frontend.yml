name: CI Frontend

on:
  push:
    paths:
      - "src/mobile/**"
  pull_request:
    paths:
      - "src/mobile/**"

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/mobile/package-lock.json

      - run: npm ci

      - run: npx tsc --noEmit
        name: TypeScript check
