name: CI Backend

on:
  push:
    paths:
      - "src/backend/**"
  pull_request:
    paths:
      - "src/backend/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore src/backend/TinacoInteligente.sln

      - run: dotnet build src/backend/TinacoInteligente.sln --no-restore

      - run: dotnet test src/backend/TinacoInteligente.sln --no-build --verbosity normal
